<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123a9d">
<meta name="description" content="وب‌سایت شرکت تعاونی عشایری کوه نور دهدشت">
<title>شرکت تعاونی عشایری کوه نور دهدشت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="https://s6.uupload.ir/files/picsart_26-08-12_20-56-50-770_ahhz.png" alt="سازمان امور عشایر ایران">
    <div class="brand-title">شرکت تعاونی عشایری کوه نور دهدشت<span></span></div>
    <img src="https://s6.uupload.ir/files/1786554350546_9ait.png" alt="شرکت تعاونی عشایری کوه نور دهدشت">
  </div>
</header>

<main>
  <section>
    <div class="head">
      <div><h1>آخرین اخبار</h1></div>
      <button id="archive" class="icon" aria-label="آرشیو اخبار" title="آرشیو اخبار">☰</button>
    </div>
    <div class="trackbox">
      <button id="nprev" class="nav right" aria-label="خبر قبلی">‹</button>
      <div id="news" class="track"></div>
      <button id="nnext" class="nav left" aria-label="خبر بعدی">›</button>
    </div>
    <div id="ndots" class="dots"></div>
  </section>

  <section>
    <div class="head">
      <div><h2>گزارش تصویری</h2></div>
      <button id="gallery" class="icon" aria-label="مشاهده گزارش تصویری" title="گزارش تصویری">▧</button>
    </div>
    <div class="trackbox">
      <button id="gprev" class="nav right" aria-label="تصویر قبلی">‹</button>
      <div id="photos" class="track"></div>
      <button id="gnext" class="nav left" aria-label="تصویر بعدی">›</button>
    </div>
    <div id="pdots" class="dots"></div>
  </section>

  <section class="buttons">
    <button data-panel="nomads">عشایر؛ سرمایه ملّی <span>←</span></button>
    <button data-panel="coop">چگونگی تعاونی <span>←</span></button>
    <button data-panel="docs">اسناد و مدارک <span>←</span></button>
    <button data-panel="about">درباره ما <span>←</span></button>
  </section>
</main>

<div id="overlay" class="overlay" aria-hidden="true">
  <article class="modal" role="dialog" aria-modal="true">
    <button id="close" class="close" aria-label="بستن">×</button>
    <div id="content"></div>
  </article>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
